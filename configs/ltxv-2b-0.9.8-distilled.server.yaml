# Official LTX-Video 0.9.8 distilled runtime.  The checkpoint and PixArt T5
# directories are staged outside Git on the GPU host.
pipeline_type: multi-scale
downscale_factor: 0.6666666
checkpoint_path: /public/lyh/projects/CV_projects/models/LTX-Video-2B-0.9.8/ltxv-2b-0.9.8-distilled.safetensors
spatial_upscaler_model_path: /public/lyh/projects/CV_projects/models/LTX-Video-2B-0.9.8/ltxv-spatial-upscaler-0.9.8.safetensors
precision: bfloat16
sampler: from_checkpoint
stg_mode: attention_values
decode_timestep: 0.05
decode_noise_scale: 0.025
text_encoder_model_name_or_path: /public/lyh/projects/CV_projects/models/PixArt-XL-2-1024-MS
prompt_enhancement_words_threshold: 0
prompt_enhancer_image_caption_model_name_or_path: unused
prompt_enhancer_llm_model_name_or_path: unused
stochastic_sampling: false
first_pass:
  timesteps: [1.0000, 0.9937, 0.9875, 0.9812, 0.9750, 0.9094, 0.7250]
  guidance_scale: 1
  stg_scale: 0
  rescaling_scale: 1
  skip_block_list: [42]
second_pass:
  timesteps: [0.9094, 0.7250, 0.4219]
  guidance_scale: 1
  stg_scale: 0
  rescaling_scale: 1
  skip_block_list: [42]
