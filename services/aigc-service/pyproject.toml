[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "metacut-aigc-service"
version = "0.1.0"
description = "Local-first multimodal inference gateway for MetaCut"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.8,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.2,<10",
]
vlm = [
  "accelerate>=1.2,<2",
  "qwen-vl-utils>=0.0.10,<1",
  "transformers>=4.49,<5",
]
image = [
  "accelerate>=1.2,<2",
  "diffusers>=0.32,<1",
  "safetensors>=0.4,<1",
  "torch>=2.5,<3",
  "transformers>=4.49,<5",
]
video = [
  "accelerate>=1.2,<2",
  "diffusers>=0.32,<1",
  "imageio-ffmpeg>=0.5,<1",
  "safetensors>=0.4,<1",
  "torch>=2.5,<3",
  "transformers>=4.49,<5",
]
hunyuan = [
  "accelerate>=1.2,<2",
  "diffusers>=0.40,<0.41",
  "imageio-ffmpeg>=0.5,<1",
  "safetensors>=0.4,<1",
  "torch>=2.5,<3",
  "transformers>=4.51,<5",
]
queue = ["redis>=5,<6", "rq>=2,<3"]
all-models = [
  "accelerate>=1.2,<2",
  "diffusers>=0.32,<1",
  "imageio-ffmpeg>=0.5,<1",
  "qwen-vl-utils>=0.0.10,<1",
  "redis>=5,<6",
  "rq>=2,<3",
  "safetensors>=0.4,<1",
  "torch>=2.5,<3",
  "transformers>=4.49,<5",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
